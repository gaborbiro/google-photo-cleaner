<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photo Cleaner Connector</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; }
    label { display: block; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 4px; font: inherit; }
    button { margin-top: 10px; padding: 4px 12px; font: inherit; }
    #state { margin-top: 10px; font-weight: 600; }
    .hint { color: #666; margin-top: 4px; }
  </style>
</head>
<body>
  <div>Read-only connector for the local Photo Cleaner app.</div>
  <label>Pairing token (shown in the app)
    <input id="token" type="password" autocomplete="off" spellcheck="false">
  </label>
  <label>Port
    <input id="port" type="number" min="1024" max="65535">
  </label>
  <button id="save">Save and connect</button>
  <div id="state">…</div>
  <div class="hint" id="tabs"></div>
  <script src="popup.js"></script>
</body>
</html>
