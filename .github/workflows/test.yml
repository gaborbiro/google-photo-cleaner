# Everything must pass on every push and pull request: the same `npm run check` as on a laptop.
name: Test

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Extension dependencies
        working-directory: extension
        run: npm ci

      - name: Kotlin and extension checks (npm run check)
        working-directory: extension
        run: npm run check
