<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.5 system-ui, sans-serif; width: 420px; margin: 12px; background: Canvas; color: CanvasText; }
    button { font: inherit; padding: 5px 10px; margin: 0 6px 6px 0; }
    #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.85; max-height: 260px; overflow: auto; }
  </style>
</head>
<body>
  <b>Browser AI test</b>
  <p>1. <button id="tab">Open in its own tab</button><br>
     2. On photos.google.com, click the purple <b>AI test</b> button (bottom right).<br>
     3. <button id="background">Run in the background</button> (you can close this popup; reopen it to see progress)<br>
     4. <button id="worker">Check the GPU in the background worker</button></p>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
